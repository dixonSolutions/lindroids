# Every push to main is a release: v<major>.<minor>.<commit count> (scripts/version.sh).
# Builds the CLI for 8 targets, xwayland-satellite (8 builds, cached by its pin), the .debs,
# pacman, rpm, apk and xbps packages and tarballs (scripts/build-release.sh), publishes the signed
# APT, pacman, RPM, apk and xbps repositories to gh-pages and a GitHub Release with the artifacts.
# Commits whose message contains "[skip ci]" do not release. See docs/PACKAGING.md.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One publish at a time; a newer push waits for the running one instead of racing on gh-pages.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Android NDK r27c, for cargo-ndk (the Termux builds).
  NDK_VERSION: 27.2.12479018
  NDK_RELEASE: r27c
  NDK_SHA256: 59c2f6dc96743b5daf5d1626684640b20a6bd2b1d85b13156b90333741bad5cc
  # scripts/build-xwayland-satellite.sh builds its Debian half in debian:bookworm; the rpm, apk and
  # xbps packages and repositories are made in fedora, alpine and void containers.
  LINDROIDS_CONTAINER_ENGINE: docker

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          eval "$(scripts/version.sh)"
          {
            echo "version=$LINDROIDS_VERSION"
            echo "build_id=$LINDROIDS_BUILD_ID"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$LINDROIDS_VERSION"
          # A re-run of the same commit may reuse its tag; another commit must not.
          tagged=$(git ls-remote --tags origin "refs/tags/v$LINDROIDS_VERSION" | cut -f1)
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::tag v$LINDROIDS_VERSION already exists on $tagged (history rewritten?)"
            exit 1
          fi

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # The *-linux-gnu targets are for xwayland-satellite's glibc builds (x86_64 is the host).
          targets: >-
            aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android,
            aarch64-unknown-linux-musl,armv7-unknown-linux-musleabihf,x86_64-unknown-linux-musl,i686-unknown-linux-musl,
            aarch64-unknown-linux-gnu,armv7-unknown-linux-gnueabihf,i686-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # The NDK for the Termux builds (cargo-ndk); no Android SDK, sdkmanager or Java. The runner
      # image's copy when it is this version, else Google's zip (checked, and cached).
      - name: Android NDK (on the runner?)
        id: ndk
        run: |
          for d in "${ANDROID_NDK_ROOT:-}" "/usr/local/lib/android/sdk/ndk/$NDK_VERSION"; do
            rev=$(sed -n 's/^Pkg.Revision *= *//p' "$d/source.properties" 2>/dev/null | tr -d '\r ')
            if [ "$rev" = "$NDK_VERSION" ]; then
              echo "ANDROID_NDK_HOME=$d" >> "$GITHUB_ENV"
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Cache the Android NDK
        if: steps.ndk.outputs.found != 'true'
        uses: actions/cache@v4
        with:
          path: ~/android-ndk-${{ env.NDK_RELEASE }}
          key: android-ndk-${{ env.NDK_VERSION }}

      - name: Download the Android NDK
        if: steps.ndk.outputs.found != 'true'
        run: |
          dir=$HOME/android-ndk-$NDK_RELEASE
          if [ ! -f "$dir/source.properties" ]; then
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/ndk.zip" "https://dl.google.com/android/repository/android-ndk-$NDK_RELEASE-linux.zip"
            echo "$NDK_SHA256  $RUNNER_TEMP/ndk.zip" | sha256sum -c -
            unzip -q "$RUNNER_TEMP/ndk.zip" -d "$HOME"
            rm "$RUNNER_TEMP/ndk.zip"
          fi
          grep -q "^Pkg.Revision *= *$NDK_VERSION" "$dir/source.properties"
          echo "ANDROID_NDK_HOME=$dir" >> "$GITHUB_ENV"

      # libclang (bindgen), pkg-config and patch: xwayland-satellite's Termux build.
      - name: Packaging tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q dpkg-dev foot fonts-dejavu-core libclang-dev pkg-config patch libarchive-tools

      # Built from source only when the pin or the patches change (same key as ci.yml).
      - name: Cache xwayland-satellite
        uses: actions/cache@v4
        with:
          path: target/xwls/out
          key: xwls-${{ hashFiles('scripts/build-xwayland-satellite.sh', 'third_party/xwayland-satellite/*.patch') }}

      - name: JDK for the window app
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK for the window app
        run: |
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          fi

      - name: Tests
        run: cargo test --workspace

      - name: Host integration test
        run: tests/host-integration.sh

      - name: Build release
        id: build
        env:
          HAVE_GPG_KEY: ${{ secrets.LINDROIDS_GPG_PRIVATE_KEY != '' && 'yes' || '' }}
          HAVE_RSA_KEY: ${{ secrets.LINDROIDS_APK_RSA_KEY != '' && 'yes' || '' }}
          LINDROIDS_APP_KEYSTORE: ${{ secrets.LINDROIDS_APP_KEYSTORE }}
          LINDROIDS_APP_KEYSTORE_PASS: ${{ secrets.LINDROIDS_APP_KEYSTORE_PASS }}
          LINDROIDS_APP_KEY_ALIAS: ${{ secrets.LINDROIDS_APP_KEY_ALIAS }}
          LINDROIDS_GITHUB_REPO: ${{ github.repository }}
        run: |
          # Without the signing key (a fork, or before scripts/set-github-secrets.sh) everything
          # is still built and tested, and nothing is published: releases are then made with
          # scripts/publish-local.sh where the key is.
          if [ -z "$HAVE_GPG_KEY" ]; then
            echo "::warning::the signing secret is not set (scripts/set-github-secrets.sh): built, not published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            if [ -n "$LINDROIDS_APP_KEYSTORE" ]; then echo "app=yes" >> "$GITHUB_OUTPUT"; else echo "app=no" >> "$GITHUB_OUTPUT"; fi
            # The apk and xbps repositories are signed with their own (RSA) key.
            if [ -z "$HAVE_RSA_KEY" ]; then
              echo "::warning::LINDROIDS_APK_RSA_KEY is not set (scripts/set-github-secrets.sh): the apk and xbps repositories are not updated"
            fi
          fi
          scripts/build-release.sh

      - name: Fetch the published site
        if: steps.build.outputs.publish == 'true'
        run: |
          mkdir -p site
          if git fetch --depth 1 origin gh-pages 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C site
          else
            echo "no gh-pages branch yet: starting an empty repository"
          fi

      - name: Build the repositories
        if: steps.build.outputs.publish == 'true'
        env:
          LINDROIDS_GPG_PRIVATE_KEY: ${{ secrets.LINDROIDS_GPG_PRIVATE_KEY }}
          LINDROIDS_APK_RSA_KEY: ${{ secrets.LINDROIDS_APK_RSA_KEY }}
        run: |
          if [ -z "$LINDROIDS_GPG_PRIVATE_KEY" ]; then
            echo "::error::LINDROIDS_GPG_PRIVATE_KEY is not set (scripts/set-github-secrets.sh)"
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          packaging/repo/build-repo.sh site --debs dist/debs --pacman dist/pacman \
            --rpm dist/rpm --apk dist/apk --xbps dist/xbps --keep 3 \
            --base-url "https://$owner.github.io/$repo" --github-repo "$GITHUB_REPOSITORY"

      # What Lindroids is, how to install or upgrade it on every system, and the commits since the
      # last release (scripts/release-notes.sh).
      - name: Release notes
        if: steps.build.outputs.publish == 'true'
        run: scripts/release-notes.sh "${{ steps.version.outputs.version }}" > "$RUNNER_TEMP/notes.md"

      - name: GitHub Release
        if: steps.build.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Lindroids ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/notes.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/lindroids-*.tar.gz
            dist/debs/*.deb
            dist/rpm/*.rpm
            dist/SHA256SUMS

      # The window app is signed with the project key; never publish a test-signed one.
      - name: Upload the window app
        if: steps.build.outputs.publish == 'true' && steps.build.outputs.app == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v$(cat dist/VERSION)" dist/lindroids-*.apk --clobber

      # After the release, so install.sh's VERSION never points at a release that does not exist.
      - name: Publish to gh-pages
        if: steps.build.outputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: "Publish Lindroids ${{ steps.version.outputs.version }} [skip ci]"
