# The website (site/, SvelteKit + shadcn-svelte), built and published to gh-pages only when it
# changes: site/, the media it shows, or this workflow. Pull requests build it without publishing.
# The release workflow publishes the package repositories to the same branch. This one replaces
# only the website's files (index.html, _app/, media/, robots.txt) in what is published, and
# pushes only if gh-pages has not moved meanwhile (else it starts again); the release takes the
# website's files from gh-pages again right before it publishes.
name: site

on:
  push:
    branches: [main]
    paths: [site/**, media/**, .github/workflows/site.yml]
  pull_request:
    paths: [site/**, media/**, .github/workflows/site.yml]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build
        working-directory: site
        run: |
          npm ci
          npm run check
          BASE_PATH="/${GITHUB_REPOSITORY#*/}" npm run build

      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for try in 1 2 3 4 5; do
            rm -rf public && mkdir public
            if git fetch --depth 1 origin gh-pages; then
              lease=$(git rev-parse FETCH_HEAD)
              git archive FETCH_HEAD | tar -x -C public
            else
              lease=   # no gh-pages yet: only create it
            fi
            rm -rf public/_app public/media public/index.html public/robots.txt
            cp -a site/build/. public/
            touch public/.nojekyll
            export GIT_INDEX_FILE=$RUNNER_TEMP/pages.index
            rm -f "$GIT_INDEX_FILE"
            (cd public && git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree=. add -A)
            commit=$(git commit-tree "$(git write-tree)" -m "Publish the site ($GITHUB_SHA) [skip ci]")
            unset GIT_INDEX_FILE
            if git push --force-with-lease="refs/heads/gh-pages:$lease" origin "$commit:refs/heads/gh-pages"; then
              exit 0
            fi
            echo "gh-pages moved meanwhile; again"; sleep $((try * 10))
          done
          exit 1
