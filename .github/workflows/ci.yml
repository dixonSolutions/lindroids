# Pull requests: unit tests, the host integration test, xwayland-satellite for all 8 targets
# (cached by its pin), and a check that the packaging scripts still build. Nothing is signed with
# release keys and nothing is published.
name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Android NDK r27c, for cargo-ndk (the Termux builds of xwayland-satellite).
  NDK_VERSION: 27.2.12479018
  NDK_RELEASE: r27c
  NDK_SHA256: 59c2f6dc96743b5daf5d1626684640b20a6bd2b1d85b13156b90333741bad5cc

jobs:
  # scripts/build-xwayland-satellite.sh: 4 Termux builds (cargo-ndk) and 4 Debian builds (in a
  # debian:bookworm container). The outputs are cached keyed by the script (it holds the pins)
  # and the patches, so this only compiles when they change; with a cache hit it re-checks the
  # binaries with readelf.
  xwayland-satellite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LINDROIDS_CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@v4

      - name: Cache xwayland-satellite
        id: xwls-cache
        uses: actions/cache@v4
        with:
          path: target/xwls/out
          key: xwls-${{ hashFiles('scripts/build-xwayland-satellite.sh', 'third_party/xwayland-satellite/*.patch') }}

      - name: Rust toolchain
        if: steps.xwls-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android,
            aarch64-unknown-linux-gnu,armv7-unknown-linux-gnueabihf,i686-unknown-linux-gnu

      - name: cargo-ndk
        if: steps.xwls-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # The NDK (no Android SDK, sdkmanager or Java): the runner image's copy when it is this
      # version, else Google's zip (checked, and cached). As in release.yml.
      - name: Android NDK (on the runner?)
        id: ndk
        if: steps.xwls-cache.outputs.cache-hit != 'true'
        run: |
          for d in "${ANDROID_NDK_ROOT:-}" "/usr/local/lib/android/sdk/ndk/$NDK_VERSION"; do
            rev=$(sed -n 's/^Pkg.Revision *= *//p' "$d/source.properties" 2>/dev/null | tr -d '\r ')
            if [ "$rev" = "$NDK_VERSION" ]; then
              echo "ANDROID_NDK_HOME=$d" >> "$GITHUB_ENV"
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Cache the Android NDK
        if: steps.xwls-cache.outputs.cache-hit != 'true' && steps.ndk.outputs.found != 'true'
        uses: actions/cache@v4
        with:
          path: ~/android-ndk-${{ env.NDK_RELEASE }}
          key: android-ndk-${{ env.NDK_VERSION }}

      - name: Download the Android NDK
        if: steps.xwls-cache.outputs.cache-hit != 'true' && steps.ndk.outputs.found != 'true'
        run: |
          dir=$HOME/android-ndk-$NDK_RELEASE
          if [ ! -f "$dir/source.properties" ]; then
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/ndk.zip" "https://dl.google.com/android/repository/android-ndk-$NDK_RELEASE-linux.zip"
            echo "$NDK_SHA256  $RUNNER_TEMP/ndk.zip" | sha256sum -c -
            unzip -q "$RUNNER_TEMP/ndk.zip" -d "$HOME"
            rm "$RUNNER_TEMP/ndk.zip"
          fi
          grep -q "^Pkg.Revision *= *$NDK_VERSION" "$dir/source.properties"
          echo "ANDROID_NDK_HOME=$dir" >> "$GITHUB_ENV"

      - name: Build tools
        if: steps.xwls-cache.outputs.cache-hit != 'true'
        run: |
          # libclang for bindgen (xcb-util-cursor-sys); patch for the Android crate patches.
          sudo apt-get update -q && sudo apt-get install -y -q libclang-dev pkg-config patch

      - name: Build (or check the cached build)
        run: scripts/build-xwayland-satellite.sh all

      - uses: actions/upload-artifact@v4
        with:
          name: xwayland-satellite
          path: target/xwls/out
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Test dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q foot fonts-dejavu-core shellcheck

      - name: JDK for the window app
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Window app
        run: packaging/build-webview-apk.sh --version 0.0.0 --out target/ci-apk --debug-sign

      - name: Shell scripts
        run: |
          shellcheck -S warning scripts/build-release.sh scripts/version.sh \
            scripts/set-github-secrets.sh scripts/publish-local.sh scripts/build-xwayland-satellite.sh \
            scripts/build.sh scripts/use-release.sh \
            packaging/*.sh packaging/repo/*.sh tests/*.sh lab/*.sh
          shellcheck -S warning -s sh install.sh

      - name: Tests
        run: cargo test --workspace

      - name: Host integration test
        run: tests/host-integration.sh

      - name: Upload the last frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-integration-frame
          path: target/host-integration-last.png
          if-no-files-found: ignore

  # Every repository end to end with throwaway keys (tests/install-repos.sh): static build, the
  # .deb, pacman, rpm, apk and xbps packages (with the xwayland-satellite job's binaries), the
  # repositories (build-repo.sh), then install.sh against them in containers of Debian, Ubuntu,
  # Kali, Arch, Fedora, Rocky, openSUSE Tumbleweed and Leap, Alpine (stable and edge), Chimera and
  # Void (glibc and musl): each must pick its package manager and install from its repository.
  package:
    needs: xwayland-satellite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LINDROIDS_CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-package

      - uses: actions/download-artifact@v4
        with:
          name: xwayland-satellite
          path: target/xwls/out

      - name: Repositories and install.sh
        run: |
          command -v bsdtar >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q libarchive-tools; }
          eval "$(scripts/version.sh)"
          export LINDROIDS_BUILD_ID
          cargo build -p lindroids --release --target x86_64-unknown-linux-musl
          tests/install-repos.sh --bin target/x86_64-unknown-linux-musl/release/lindroids --xwls target/xwls/out

      - name: Upload the install logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-repos-logs
          path: target/install-repos/logs
          if-no-files-found: ignore
