<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="78%">
      <stop offset="0" stop-color="#1D2E48"/>
      <stop offset="0.55" stop-color="#101B2B"/>
      <stop offset="1" stop-color="#070C14"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D6E2EF"/>
    </linearGradient>
    <linearGradient id="backframe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C405C"/>
      <stop offset="1" stop-color="#1A2A40"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101C2C"/>
      <stop offset="1" stop-color="#09111B"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7BF0AE"/>
      <stop offset="1" stop-color="#22C55E"/>
