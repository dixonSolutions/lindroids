[package]
name = "lindroids"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Linux GUI programs on Android, in windows and apps of their own: a package for Termux, proot distros and Flatpak"

[[bin]]
name = "lindroids"
path = "src/main.rs"

[dependencies]
lindroids-proto = { path = "../lindroids-proto" }
lindroids-server = { path = "../lindroids-server" }
lindroids-apk = { path = "../lindroids-apk" }
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
log.workspace = true
base64 = "0.22"
tar = { version = "0.4", default-features = false }
resvg = { version = "0.45", default-features = false }
png = "0.17"
x11rb = { version = "0.13", default-features = false }
