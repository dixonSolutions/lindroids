<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<meta name="theme-color" content="#0F1720">
<title>Lindroids</title>
<link rel="icon" href="/icon.svg">
<style>
  :root { color-scheme: dark; --bar: #0F1720; --fg: #E8EEF4; --dim: #9AA7B4; --accent: #3DDC84; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); font: 14px system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; }
  #bar { flex: none; display: flex; align-items: stretch; height: 36px; background: var(--bar); user-select: none; -webkit-user-select: none; }
  #tabs { flex: 1; display: flex; overflow-x: auto; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 0 4px 0 10px; max-width: 220px; min-width: 0; color: var(--dim); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); background: #1B2430; }
  .tab img { width: 18px; height: 18px; flex: none; }
  .tab span { overflow: hidden; text-overflow: ellipsis; }
  .tab button, #tools button { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; }
  .tab button { padding: 4px 6px; font-size: 16px; line-height: 1; opacity: .7; }
  #tools { display: flex; }
  #tools button { width: 40px; font-size: 18px; color: var(--dim); }
  #tools button:hover, .tab button:hover { color: var(--fg); opacity: 1; }
  #stage { flex: 1; position: relative; min-height: 0; background: #000; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; outline: none; cursor: var(--cursor, default); }
  #stage canvas.active { display: block; }
  #panel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  #panel[hidden] { display: none; }
  #panel .box { max-width: 30em; line-height: 1.5; }
  #panel img { width: 72px; height: 72px; }
  #panel code { background: #1B2430; padding: 2px 6px; border-radius: 4px; }
  #panel input { font: 24px monospace; width: 7em; text-align: center; letter-spacing: .2em; padding: 6px; border-radius: 6px; border: 1px solid #334; background: #0F1720; color: var(--fg); }
  #panel button, .toast button, .dialog button { font: inherit; padding: 8px 16px; margin: 4px; border-radius: 6px; border: 0; background: var(--accent); color: #0F1720; cursor: pointer; }
  #panel .err { color: #ff8a80; }
  #panel pre.output { text-align: left; max-width: min(46em, 92vw); max-height: 40vh; overflow: auto; margin: 12px auto; padding: 10px 12px;
    background: #1B2430; border: 1px solid #334; border-radius: 8px; color: #ffb4a9; font: 12px/1.45 monospace; white-space: pre-wrap; word-break: break-word; user-select: text; -webkit-user-select: text; }
  #panel .box:has(pre.output) { max-width: 48em; }
  #ime { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; border: 0; padding: 0; resize: none; pointer-events: none; font-size: 16px; }
  #toasts { position: fixed; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 8px; max-width: min(360px, calc(100% - 16px)); z-index: 5; }
  .toast, .dialog { background: #1B2430; border: 1px solid #334; border-radius: 10px; padding: 10px 12px; box-shadow: 0 4px 16px #0008; }
  .toast b { display: block; }
  .toast small { color: var(--dim); }
  .dialog { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 6; min-width: 260px; text-align: center; }
  .dialog .ghost { background: none; color: var(--fg); border: 1px solid #334; }
  /* The picker: a sheet from the bottom, over the program. The source choices are a line each. */
  .picker { position: fixed; inset: 0; z-index: 7; display: flex; align-items: flex-end; justify-content: center;
    background: #0009; overscroll-behavior: contain; }
  .picker .sheet { display: flex; flex-direction: column; width: min(540px, 100%); max-height: min(86vh, calc(100% - 12px));
    padding: 8px 14px calc(12px + env(safe-area-inset-bottom)); background: #141C26; color: var(--fg);
    border: 1px solid #334; border-bottom: 0; border-radius: 16px 16px 0 0; box-shadow: 0 -10px 40px #000a; }
  .picker .head { display: flex; align-items: center; gap: 8px; padding: 2px 0 8px; }
  .picker .head h2 { flex: 1; min-width: 0; margin: 0; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picker .x { flex: none; padding: 4px 10px; border: 0; background: none; color: var(--dim); font: 20px/1 system-ui, sans-serif; cursor: pointer; }
  .picker .sources { border-top: 1px solid #334; }
  .picker .sources button { display: block; width: 100%; padding: 14px 6px; border: 0; border-bottom: 1px solid #334;
    background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
  .picker .sources button:hover, .picker .sources button:focus-visible { background: #1B2430; }
  .picker .sources small { display: block; margin-top: 3px; color: var(--dim); }
  .picker .where { display: flex; align-items: center; gap: 6px; padding: 7px 0; border-bottom: 1px solid #334; }
  .picker .where .path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--dim); font: 12px/1.4 monospace; direction: ltr; text-align: left; }
  .picker .where button { flex: none; padding: 5px 9px; border: 1px solid #334; border-radius: 6px; background: none;
    color: var(--fg); font: inherit; cursor: pointer; }
  .picker .list { flex: 1; min-height: 90px; overflow: auto; overscroll-behavior: contain; }
  .picker .row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 6px; border: 0;
    border-bottom: 1px solid #26313d; background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
  .picker .row:hover, .picker .row:focus-visible { background: #1B2430; }
  .picker .row.sel { background: #3DDC8422; }
  .picker .row .i { flex: none; width: 20px; color: var(--accent); text-align: center; }
  .picker .row .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picker .row .s { flex: none; color: var(--dim); font-size: 12px; }
  .picker .err { padding: 12px 4px; color: #ff8a80; line-height: 1.45; }
  .picker .empty { padding: 16px 4px; color: var(--dim); text-align: center; }
  .picker .foot { display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid #334; }
  .picker .foot input { flex: 1; min-width: 0; padding: 9px 10px; border: 1px solid #334; border-radius: 6px;
    background: #0F1720; color: var(--fg); font: inherit; }
  .picker .foot button { flex: none; padding: 9px 14px; border: 0; border-radius: 6px; background: var(--accent);
    color: #0F1720; font: inherit; cursor: pointer; }
  .picker .foot button.ghost { border: 1px solid #334; background: none; color: var(--fg); }
  /* A window of its own showing one program: the program has the whole window; the tools wait
     behind a small handle at the top. */
  #handle { display: none; }
  body.solo #tabs { display: none; }
  body.solo #bar { position: fixed; top: 0; left: 50%; transform: translate(-50%, -110%); z-index: 4; height: 44px;
    border-radius: 0 0 14px 14px; background: #0F1720e8; box-shadow: 0 4px 16px #0008; transition: transform .18s; }
  body.solo.tools #bar { transform: translate(-50%, 0); }
  body.solo #handle { display: block; position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 3;
    width: 72px; height: 12px; padding: 0; border: 0; background: none; cursor: pointer; touch-action: none; }
  body.solo #handle::after { content: ""; display: block; margin: 3px auto 0; width: 40px; height: 4px; border-radius: 2px; background: #fff6; }
</style>
</head>
<body>
<div id="bar">
  <div id="tabs"></div>
  <div id="tools">
    <button id="paste" title="Paste the clipboard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9z"/></svg></button>
    <button id="kb" title="Keyboard">⌨</button>
    <button id="fs" title="Full screen">⛶</button>
    <button id="neww" title="New window" hidden>＋</button>
  </div>
</div>
<button id="handle" title="Tools" aria-label="Tools"></button>
<div id="stage">
  <div id="panel"><div class="box"><img src="/icon.svg" alt=""><p>Connecting to Lindroids…</p></div></div>
</div>
<textarea id="ime" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-hidden="true"></textarea>
<div id="toasts"></div>
<script src="/lindroids.js"></script>
</body>
</html>
